<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Monetag -->
<script src="https://libtl.com/sdk.js" data-zone="10938120" data-sdk="show_10938120"></script>

<!-- Telegram -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<title>Tech Reward App</title>

<style>

/* 🌌 Animated Background */
body {
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family: 'Segoe UI', sans-serif;
  color:white;
  overflow:hidden;
  background: linear-gradient(-45deg, #0f172a, #020617, #1e293b, #020617);
  background-size: 400% 400%;
  animation: gradientBG 10s ease infinite;
}

@keyframes gradientBG {
  0% {background-position:0% 50%;}
  50% {background-position:100% 50%;}
  100% {background-position:0% 50%;}
}

/* ✨ Floating particles */
body::before {
  content:"";
  position:absolute;
  width:200%;
  height:200%;
  background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
  background-size: 50px 50px;
  animation: moveStars 60s linear infinite;
}

@keyframes moveStars {
  from {transform: translateY(0);}
  to {transform: translateY(-500px);}
}

/* 🧊 Glass Card */
.box {
  width:360px;
  padding:25px;
  border-radius:20px;
  backdrop-filter: blur(15px);
  background: rgba(30,41,59,0.6);
  box-shadow: 0 0 30px rgba(0,0,0,0.5);
  text-align:center;
  z-index:2;
}

/* Title */
h2 {
  margin-bottom:10px;
  font-weight:600;
}

/* Stats */
p {
  margin:5px 0;
  opacity:0.9;
}

/* 📊 Progress Bar */
.progress {
  height:12px;
  background:#1e293b;
  border-radius:10px;
  margin-top:15px;
  overflow:hidden;
}

.fill {
  height:100%;
  width:0%;
  background: linear-gradient(90deg, #22c55e, #4ade80);
  border-radius:10px;
  transition:0.5s;
}

/* ⚡ Neon Button */
button {
  width:100%;
  padding:14px;
  margin-top:20px;
  border:none;
  border-radius:12px;
  background: linear-gradient(90deg,#22c55e,#4ade80);
  color:white;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
  box-shadow: 0 0 15px rgba(34,197,94,0.6);
  transition:0.3s;
}

button:hover {
  transform:scale(1.05);
  box-shadow: 0 0 25px rgba(34,197,94,1);
}

</style>

</head>
<body>

<div class="box">
  <h2>⚡ Tech Reward</h2>

  <p id="user">Checking login...</p>

  <p>📺 Ads: <span id="ads">0</span></p>
  <p>💰 Points: <span id="points">0</span></p>

  <div class="progress">
    <div class="fill" id="fill"></div>
  </div>

  <button onclick="watchAd()">🚀 Watch Ad</button>
</div>

<script>

let ads = 0;
let points = 0;

let tg = window.Telegram.WebApp;
tg.expand();

// 👤 User Info
if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
  let user = tg.initDataUnsafe.user;
  document.getElementById("user").innerText =
    "👤 " + user.first_name;
} else {
  document.getElementById("user").innerText =
    "❌ Open from Telegram";
}

// 📊 Update UI
function update() {
  document.getElementById("ads").innerText = ads;
  document.getElementById("points").innerText = points;

  let progress = (ads % 5) * 20;
  document.getElementById("fill").style.width = progress + "%";
}

// 🎬 Watch Ad
function watchAd() {
  if (typeof show_10938120 === 'function') {

    show_10938120().then(() => {
      ads++;
      points++;

      if (ads % 5 === 0) {
        points += 10;
        alert("🎁 Bonus +10");
      }

      update();
    }).catch(() => {
      alert("Ad failed ❌");
    });

  } else {
    alert("SDK not loaded ❌");
  }
}

update();

</script>

</body>
</html>
