<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Monetag -->
<script src='//libtl.com/sdk.js' data-zone='10816880' data-sdk='show_10816880'></script>

<!-- Telegram -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<title>ADS REWARDS</title>

<style>

/* 🌌 Background */
body {
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family: 'Segoe UI', sans-serif;
  color:white;
  overflow:hidden;
  background: linear-gradient(-45deg, #020617, #0f172a, #020617, #1e293b);
  background-size: 400% 400%;
  animation: bgMove 10s ease infinite;
}

@keyframes bgMove {
  0% {background-position:0% 50%;}
  50% {background-position:100% 50%;}
  100% {background-position:0% 50%;}
}

/* ⚡ FULL SCREEN CANVAS */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  z-index: 0;
}

/* 🧊 Glass Card */
.box {
  width:360px;
  padding:25px;
  border-radius:20px;
  backdrop-filter: blur(15px);
  background: rgba(30,41,59,0.6);
  box-shadow: 0 0 30px rgba(0,0,0,0.5);
  text-align:center;
  z-index:2;
  position:relative;
}

/* Text */
h2 { margin-bottom:10px; }
p { margin:6px 0; }

/* Progress */
.progress {
  height:12px;
  background:#1e293b;
  border-radius:10px;
  margin-top:15px;
  overflow:hidden;
}

.fill {
  height:100%;
  width:0%;
  background: linear-gradient(90deg, #22c55e, #4ade80);
  transition:0.5s;
}

/* Button */
button {
  width:100%;
  padding:14px;
  margin-top:20px;
  border:none;
  border-radius:12px;
  background: linear-gradient(90deg,#22c55e,#4ade80);
  color:white;
  font-weight:bold;
  cursor:pointer;
  box-shadow: 0 0 15px rgba(34,197,94,0.6);
  transition:0.3s;
}

button:hover {
  transform:scale(1.05);
  box-shadow: 0 0 25px rgba(34,197,94,1);
}

</style>
</head>

<body>

<!-- ⚡ Electric Background -->
<canvas id="bg"></canvas>

<!-- UI -->
<div class="box">
  <h2>⚡ ADS REWARDS</h2>

  <p id="user">Checking login...</p>

  <p>📺 Ads: <span id="ads">0</span></p>
  <p>💰 Points: <span id="points">0</span></p>

  <div class="progress">
    <div class="fill" id="fill"></div>
  </div>

  <button onclick="watchAd()">🚀 Watch Ad</button>
</div>

<script>

// ================= TELEGRAM + ADS =================
let ads = 0;
let points = 0;

let tg = window.Telegram.WebApp;
tg.expand();

if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
  let user = tg.initDataUnsafe.user;
  document.getElementById("user").innerText =
    "👤 " + user.first_name;
} else {
  document.getElementById("user").innerText =
    "❌ Open from Telegram";
}

function update() {
  document.getElementById("ads").innerText = ads;
  document.getElementById("points").innerText = points;

  let progress = (ads % 5) * 20;
  document.getElementById("fill").style.width = progress + "%";
}

function watchAd() {
  if (typeof show_10816880 === 'function') {

    show_10816880().then(() => {
      ads++;
      points++;

      if (ads % 2 === 0) {
        points += 10;
        alert("🎁 Bonus +10");
      }

      update();
    }).catch(() => {
      alert("Ad failed ❌");
    });

  } else {
    alert("SDK not loaded ❌");
  }
}

update();


// ================= ⚡ ELECTRIC NETWORK =================
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();

window.addEventListener("resize", resize);

let nodes = [];

// 🔥 More nodes (full screen coverage)
for (let i = 0; i < 25; i++) {
  nodes.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height
  });
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {

      let dx = nodes[i].x - nodes[j].x;
      let dy = nodes[i].y - nodes[j].y;
      let dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < 350) {

        // line
        ctx.strokeStyle = "rgba(34,197,94,0.15)";
        ctx.beginPath();
        ctx.moveTo(nodes[i].x, nodes[i].y);
        ctx.lineTo(nodes[j].x, nodes[j].y);
        ctx.stroke();

        // ⚡ moving energy
        let progress = (Date.now() % 2000) / 2000;

        let px = nodes[i].x + (nodes[j].x - nodes[i].x) * progress;
        let py = nodes[i].y + (nodes[j].y - nodes[i].y) * progress;

        ctx.fillStyle = "#4ade80";
        ctx.beginPath();
        ctx.arc(px, py, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // nodes
  nodes.forEach(n => {
    ctx.fillStyle = "#22c55e";
    ctx.beginPath();
    ctx.arc(n.x, n.y, 4, 0, Math.PI * 2);
    ctx.fill();
  });

  requestAnimationFrame(draw);
}

draw();

</script>

</body>
</html>
